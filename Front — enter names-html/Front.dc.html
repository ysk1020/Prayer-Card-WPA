<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prayer card — front</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#FAF6F0}
input::placeholder{color:#B7AD9E}
input:focus{outline:none;border-color:{{accent}};box-shadow:0 0 0 3px {{accentSoft}}}
button:hover{opacity:0.92}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F0; display: flex; align-items: center; justify-content: center; padding: 32px 24px;">
  <div style="width: 100%; max-width: 340px; background: #FFFDF9; border: 1px solid #E8E1D6; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"></path>
      </svg>
      <span style="font-size: 16px; font-weight: 500; color: #3A3530;">Praying for</span>
    </div>
    <p style="margin: 0 0 12px; font-size: 13px; color: #8A8175;">Enter up to three names.</p>

    <label style="font-size: 12px; color: #8A8175; margin-bottom: 4px;" for="n1">Name 1</label>
    <input id="n1" type="text" placeholder="Mom" style="height: 40px; border-radius: 10px; border: 1px solid #E8E1D6; background: #FFFDF9; padding: 0 12px; font-size: 15px; color: #3A3530; margin-bottom: 12px; box-sizing: border-box;">

    <label style="font-size: 12px; color: #8A8175; margin-bottom: 4px;" for="n2">Name 2 (optional)</label>
    <input id="n2" type="text" placeholder="Dad" style="height: 40px; border-radius: 10px; border: 1px solid #E8E1D6; background: #FFFDF9; padding: 0 12px; font-size: 15px; color: #3A3530; margin-bottom: 12px; box-sizing: border-box;">

    <label style="font-size: 12px; color: #8A8175; margin-bottom: 4px;" for="n3">Name 3 (optional)</label>
    <input id="n3" type="text" placeholder="A friend" style="height: 40px; border-radius: 10px; border: 1px solid #E8E1D6; background: #FFFDF9; padding: 0 12px; font-size: 15px; color: #3A3530; margin-bottom: 16px; box-sizing: border-box;">

    <label style="font-size: 12px; color: #8A8175; margin-bottom: 4px;" for="note">Note (optional)</label>
    <textarea id="note" placeholder="What's on your heart for them" rows="2" style="border-radius: 10px; border: 1px solid #E8E1D6; background: #FFFDF9; padding: 10px 12px; font-size: 14px; color: #3A3530; font-family: inherit; resize: none; margin-bottom: 20px; box-sizing: border-box;"></textarea>

    <button style="height: 44px; border-radius: 10px; border: none; background: {{accent}}; color: #FFFDF9; font-size: 15px; font-weight: 500; cursor: pointer;">Reveal verse</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B97B56","options":["#B97B56","#7C8B6F","#7E96A8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#B97B56';
    return { accent, accentSoft: accent + '33' };
  }
}
</script>
</body>
</html>
